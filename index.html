<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snake</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <p class="device-label"><span class="signal-dot" aria-hidden="true"></span>POCKET SIGNAL / 01</p>
      <header>
        <div>
          <p class="eyebrow">ORBITAL GAMES</p>
          <h1>Snake</h1>
        </div>
        <p class="score" aria-live="polite"><span>Score</span><strong id="score">0</strong></p>
        <p class="score best-score" aria-live="polite"><span>Best</span><strong id="best-score">0</strong></p>
      </header>
      <section class="console" aria-label="Pocket Signal game console">
        <div class="screen-bezel">
          <div class="screen-header"><p class="screen-label">SNAKE SYSTEM</p><span class="screen-glow" aria-hidden="true"></span></div>
          <div id="board" class="board" role="application" aria-label="Snake game board"></div>
          <p id="status" class="status" aria-live="polite">Use arrow keys or WASD to move.</p>
        </div>
        <div class="console-actions">
          <button id="pause" type="button">Pause</button>
          <button id="restart" type="button">Restart</button>
        </div>
        <div class="speaker" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="controls" aria-label="Snake controls">
        <button type="button" data-direction="up" aria-label="Move up">▲</button>
        <button type="button" data-direction="left" aria-label="Move left">◀</button>
        <button type="button" data-direction="down" aria-label="Move down">▼</button>
        <button type="button" data-direction="right" aria-label="Move right">▶</button>
      </div>
      <p class="control-note">ARROWS / WASD TO MOVE</p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
