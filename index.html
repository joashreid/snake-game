<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snake</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <header>
        <h1>Snake</h1>
        <p class="score" aria-live="polite">Score: <span id="score">0</span></p>
      </header>
      <div id="board" class="board" role="application" aria-label="Snake game board"></div>
      <p id="status" class="status" aria-live="polite">Use arrow keys or WASD to move.</p>
      <div class="actions">
        <button id="pause" type="button">Pause</button>
        <button id="restart" type="button">Restart</button>
      </div>
      <div class="controls" aria-label="Snake controls">
        <button type="button" data-direction="up" aria-label="Move up">Up</button>
        <button type="button" data-direction="left" aria-label="Move left">Left</button>
        <button type="button" data-direction="down" aria-label="Move down">Down</button>
        <button type="button" data-direction="right" aria-label="Move right">Right</button>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
